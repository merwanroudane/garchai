[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garchai"
version = "0.1.0"
description = "Econometrically constrained, differentiable, AI-enhanced conditional heteroskedasticity models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords = [
    "garch", "volatility", "neural-network", "deep-learning", "econometrics",
    "value-at-risk", "realized-volatility", "financial-time-series", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "torch>=2.0",
]

[project.optional-dependencies]
benchmarks = ["arch>=6.2", "statsmodels>=0.14", "scikit-learn>=1.3", "xgboost>=2.0"]
plots = ["matplotlib>=3.7"]
data = ["yfinance>=0.2", "pandas-datareader>=0.10"]
tuning = ["optuna>=3.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "PyYAML>=6.0"]
all = [
    "arch>=6.2", "statsmodels>=0.14", "scikit-learn>=1.3", "xgboost>=2.0",
    "matplotlib>=3.7", "yfinance>=0.2", "pandas-datareader>=0.10", "optuna>=3.4",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/merwanroudane/garchai"
Repository = "https://github.com/merwanroudane/garchai"
Documentation = "https://github.com/merwanroudane/garchai#readme"
Issues = "https://github.com/merwanroudane/garchai/issues"
Changelog = "https://github.com/merwanroudane/garchai/releases"
"Reproduction log" = "https://github.com/merwanroudane/garchai/blob/main/docs/05_REPRODUCTION_LOG.md"
"Paper coverage" = "https://github.com/merwanroudane/garchai/blob/main/docs/01_COVERAGE_MATRIX.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garchai = ["resources/*.yaml", "datasets/data/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (training, SMC, paper reproduction)",
    "reproduction: paper-reproduction tests asserting published numbers",
    "external: requires an optional dependency (arch, yfinance, ...)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]  # ambiguous names: alpha/beta/omega are the domain vocabulary

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
