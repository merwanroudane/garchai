# garchai paper registry — Phase 0
# Schema per master blueprint §41. `local_pdf` is relative to the GARCH AI folder.
# code_status enum (§14): OFFICIAL | AUTHOR_LINKED | PAPER_LINKED | PACKAGE_SOURCE
#                         COMMUNITY_REPLICATION | INDEPENDENT_RELATED
#                         NO_PUBLIC_CODE_IDENTIFIED | UNKNOWN
# last_checked: 2026-08-14

papers:

  # ------------------------------------------------------------------ Tier S
  - paper_id: zhao2024_garch_nn
    title: From GARCH to Neural Network for Volatility Forecast
    authors: [Pengfei Zhao, Haoren Zhu, Wilfred Siu Hung Ng, Dik Lun Lee]
    year: 2024
    venue: AAAI 2024
    paper_url: https://arxiv.org/abs/2402.06642
    alt_url: https://ojs.aaai.org/index.php/AAAI/article/view/29643
    local_pdf: 2402.06642v1.pdf
    integration_type: structural
    models: [GARCHNN, StructuralGARCHLSTM, GARCHNNKernel, GJRNNKernel, FIGARCHNNKernel]
    key_equations: "Eq.1 GARCH; Eq.3 FI-GARCH expansion; Eq.5 N-loss; Eq.6 T-loss; Eq.7 GARCH-LSTM"
    data: {source: Yahoo Finance, series: [S&P 500, DJI, NASDAQ, EUR-USD, Gold],
           n: ~2514, split: "8:1:1", scale: 100,
           target: "sigma_t = sqrt(sum_{i=0}^{k-1} eps^2_{t-i}), k=5, not demeaned"}
    protocol: {optimizer: Adam, lr: 1e-2, lr_schedule: "halve on plateau",
               early_stopping: 20, horizons: [1, 3, 5, 10, 21], kernel: GJR-GARCH,
               metrics: [MAE, MSE], runs: 10, risk: "5% 1-day VaR = 1.65*sigma"}
    reproducible_exhibits: [Table 2, Table 3, Table 4, Table 5, Figure 2]
    code_status: NO_PUBLIC_CODE_IDENTIFIED
    priority: very_high
    build_decision: IMPLEMENT

  - paper_id: wei2025_garch_rnn
    title: Unified GARCH-Recurrent Neural Networks in Financial Volatility Forecasting
    authors: [Jingyi Wei, Steve Yang, Zhenyu Cui]
    year: 2025
    version: "v2, 21 Nov 2025"
    paper_url: https://arxiv.org/abs/2504.09380
    local_pdf: 2504.09380v2.pdf
    integration_type: structural_embedded
    models: [EmbeddedGARCHGRU, EmbeddedGARCHLSTM, EmbeddedGARCHGRUCell, EmbeddedGARCHLSTMCell]
    key_equations: "Eqs.15-20 GARCH-GRU; Eq.21 inverse-tanh form; Eqs.22-29 GARCH-LSTM"
    data: {source: Yahoo Finance, series: [S&P 500, DJI, NASDAQ],
           range: "2010-01-01..2020-12-31", n: 2658,
           target: "sigma_t = sqrt((1/k) sum_{i=1}^{k}(r_{t-i}-mu_k)^2), k=5, demeaned, lagged",
           split: "pre-2019 dev (last 20% val); test 2019; stress test 2020"}
    protocol: {window: 22, horizons: [1, 3, 7], optimizer: Adam, tuning: Optuna,
               early_stopping: 20, lr_schedule: "halve on plateau", runs: 20,
               metrics: [MSE, MAE, SMAPE, OOS_R2],
               risk: "99% VaR, violation ratio, pinball loss"}
    reproducible_exhibits: [Table 2, Table 3, COVID stress tables, VaR tables]
    code_status: NO_PUBLIC_CODE_IDENTIFIED
    priority: very_high
    build_decision: IMPLEMENT
    deviations_to_record:
      - "Eq.19 swaps the standard GRU update-gate convention relative to the paper's own Eq.13"

  - paper_id: yin2022_neural_garch
