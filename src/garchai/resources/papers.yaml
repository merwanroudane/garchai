    reproducible_exhibits: [Figure 1 feasibility diagram, Figure 2 ANN fit]
    code_status: NO_PUBLIC_CODE_IDENTIFIED
    related_repo: https://github.com/jhihan/GARCH_Neural_Network
    priority: medium_high
    build_decision: IMPLEMENT
    note: "The ANN is trained on analytically-generated moment pairs. This is
