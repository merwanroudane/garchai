      - "Eq.3 fourth standardised moment: Gamma4 = 3 + 6*a1^2 / (1 - 3*a1^2 - 2*a1*b1 - b1^2)"
      - "Eq.4 sigma^2 = alpha0 / (1 - alpha1 - beta1)"
      - "Eqs.5-8 empirical estimators of gamma_n and Gamma4"
    spec:
      inputs: "(gamma_n_hat with n = 15, Gamma4)"
      network: "MLP 2 -> 25 -> 205 -> 205 -> 25 -> 1, PyTorch"
      output: alpha1
      then: "beta1 by inverting Eq.3; alpha0 from Eq.4"
      training_set: "125,000 synthetic (alpha1, beta1) draws via Eqs.2-3;
