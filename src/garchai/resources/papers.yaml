  - paper_id: xu2024_ginn
    title: GARCH-Informed Neural Networks for Volatility Prediction in Financial Markets
    authors: [Zeda Xu, John Liechty, Sebastian Benthall, Nicholas Skar-Gislinge, Christopher McComb]
    year: 2024
    paper_url: https://arxiv.org/abs/2410.00288
    local_pdf: 2410.00288v1.pdf
    integration_type: informed_loss
    models: [GINN, GINN0, GARCHInformedNetwork, GINNDataset]
    design_note: |
      The informed objective is a function, garchai.losses.garch_informed_loss
      (Eq. 17), not a class - it composes with any architecture, which is the
      separation the paper's own discussion recommends. GARCHInformedLSTM is
      therefore GINN itself.
    key_equations: "Eqs.13-16 workflow; Eq.17 informed loss; Eq.18 GINN-0"
    spec: {loss: "lambda*MSE(sigma^2_t, ginn) + (1-lambda)*MSE(garch, ginn)",
           lambda_star: 0.01, mean_model: "AR over 90-day window",
           truth: "sigma^2_t = (r_t - mu_hat_t)^2",
           net: "3 LSTM layers x 256 + dropout, 2 linear, BatchNorm, ReLU",
           optimizer: AdamW, epochs: 300, window: 90}
    data: {source: Yahoo Finance, series: [GSPC, DJIA, NYA, RUT, HSI, NIK, FTSE],
           range: "1992-06-01 .. 2022-05-31", split: "70/30 at 2013-06-01",
           lambda_study_series: IXIC}
    reproducible_exhibits: [Table I, lambda parametric study]
    code_status: COMMUNITY
    community_repos:
      - https://github.com/yeasinstat/GarchInformedLSTM   # not downloaded
      - https://github.com/datafox-tw/GLoVE               # local: GLoVE-main.zip
    priority: high
    build_decision: REPRODUCE

