  # --------------------------- supplied 2026-08-14, second batch ------------
  - paper_id: liu2020_ann_garch
    title: A GARCH Model with Artificial Neural Networks
    authors: [Wing Ki Liu, Mike K. P. So]
    year: 2020
    venue: "Information 11(10), 489"
    doi: 10.3390/info11100489
    paper_url: https://www.mdpi.com/2078-2489/11/10/489
    local_pdf: "A GARCH Model with Artificial Neural Networks.pdf"
    integration_type: structural_likelihood
    models: [ANNGARCH]
    design_note: |
      LikelihoodGARCHLSTM is exported as an alias of ANNGARCH.
    key_equations: "Eqs.1-2 GARCH(1,1); Eqs.3-6 LSTM cell; Eq.7 h_t readout;
                    §2.2 standardized Student-t negative log-likelihood"
    spec:
      innovation: "r_t = eps_t * sqrt(h_t), eps_t ~ T(0, 1, nu) standardized"
      readout: "h_t = (log(exp(D(y_c1(t))) + 1))^2   # softplus, then squared"
      lookback: 20
      deep_head: "dense layers; identity activation preferred over ReLU
                  (ReLU gave zero-gradient regions)"
      objective: "negative log-likelihood, full normalising constants included"
      interpretability: "variable importance = drop in log-likelihood when a
                         variable is removed"
    data:
      series: S&P 500 Index
      n: 5032
      range: "2000-02-29 .. 2020-02-28"
      source: Bloomberg Terminal
      returns: "r_t = (P_t - P_{t-1})/P_{t-1} * 100   # simple, not log"
      exog: "17 variables incl. Total Assets, Net Debt/Share, Book Value/Share,
             Enterprise Value, Net Debt/EBITDA"
      availability: PROPRIETARY
      substitution_required: true      # see docs/04_DATA_POLICY.md
    reproducible_exhibits: [Table 1, variable-importance table, return-vs-sigma plots]
    code_status: NO_PUBLIC_CODE_IDENTIFIED
    priority: medium_high
    build_decision: IMPLEMENT

  - paper_id: yu2025_genshin
    title: Does multi-scale GARCH information enhance volatility prediction?
    authors: [Rentian Yu, Haotian Xiao, Yukun Zhu, Gongqiu Zhang]
    year: 2025
    venue: "Finance Research Letters 78, 107196"
    paper_url: https://www.sciencedirect.com/science/article/abs/pii/S1544612325004593
    local_pdf: "Does multi-scale GARCH information enhance volatility prediction.pdf"
    integration_type: graph_multiscale
    models: [GENSHIN, MSGNet, GARCHFeatureBank, GENSHINFeatures]
    design_note: |
      MultiScaleGARCHGraphNet in the original blueprint is MSGNet, the
      paper's own name (after Cai et al. 2024). Two supporting pieces were
      built because nothing else provides them: ComponentGARCHCell (csGARCH,
      absent from `arch`) and variational_mode_decomposition.
    framework_name: "GARCH Estimation based Network for Stock Index Heteroskedasticity INformation"
    pipeline:
      1_garch_extraction:
        specs: [sGARCH, EGARCH, GJR-GARCH, apARCH, csGARCH]
        lags: [[1, 1], [1, 3], [2, 1], [5, 5]]
        distributions: [normal, student-t, GED]
        total_models: 60
      2_vmd: "variational mode decomposition, 4 IMFs per fitted volatility -> 240 IMFs"
      3_pls: "partial least squares -> 6 principal components as network input"
      4_msgnet:
        fft: "F = Avg(Amp(FFT(X_emb))); scales s_i = L / f_i from argTopk amplitudes"
        adjacency: "A_i = SoftMax(ReLU(E1_i E2_i^T))  (adaptive, learned)"
        conv: MixHop
        attention: "multi-head, intra-series"
        aggregation: "amplitude-weighted SoftMax over k scales"
        projection: "X_hat = W_s X_out W_t + b"
    data:
