    authors: [Zexuan Yin, Paolo Barucca]
    year: 2022
    paper_url: https://arxiv.org/abs/2202.11285
    local_pdf: 2202.11285v1.pdf
    integration_type: dynamic_parameters_bayesian
    models: [NeuralGARCH, NeuralBEKK]
    design_note: |
      Student-t is a config option on NeuralGARCH (nu_t joins the latent
      coefficient vector), not a separate NeuralStudentTGARCH class.
    key_equations: "Eq.10 time-varying GARCH; Eq.11/13 diagonal BEKK; Eqs.16-17 generative;
                    Eqs.19-20 inference; Eq.21 ELBO"
    architecture: {rnn: GRU, hidden: 64, mlps: "3-layer, 64 units, ReLU",
                   positivity: sigmoid, dof: "estimate nu' = nu - 2"}
    data: {series: [20 FX pairs, Brent, silver, gold, DAX, S&P, NASDAQ, FTSE100, Dow Jones],
           range: "2011/2013 .. 2021-08-05", split: "80/10/10"}
    protocol: {objective: ELBO, inference: SGVB, evaluation: "test log-likelihood",
               benchmarks: [GARCH-N, GARCH-t, EGARCH-N, EGARCH-t]}
    reproducible_exhibits: [Table 2, Table 3, Table 4, Table 5]
    code_status: NO_PUBLIC_CODE_IDENTIFIED
    related_repo: https://github.com/stuid-maker/neural-garch   # NOT faithful
    priority: very_high
    build_decision: IMPLEMENT
    deviations_to_record:
      - "Eq.4 Student-t log-likelihood prints +logGamma(nu/2); correct sign is negative"

  - paper_id: nguyen2022_rech
    title: Recurrent Conditional Heteroskedasticity
    authors: [T.-N. Nguyen, M.-N. Tran, R. Kohn]
    year: 2022
    venue: "Journal of Applied Econometrics 37(5), 1031-1054"
    paper_url: https://arxiv.org/abs/2010.13061
    local_pdf: 2010.13061v2.pdf
    official_repo: https://github.com/VBayesLab/RECH
    code_status: OFFICIAL
    code_language: [MATLAB]
    code_local: RECH-main.zip
    integration_type: structural_additive_recurrent
    models: [RECH, SRNGARCH, SRNGJR, LSTMtGARCH]
    key_equations: "Eqs.7a-7d general RECH; Eqs.8a-8d SRN-GARCH; Theorem 1 bounded variance"
    spec: {recurrent_input: "x_t = (omega_{t-1}, y_{t-1}, sigma^2_{t-1})",
           activation: "bounded ReLU", hidden: scalar,
           constraints: "beta0,beta1 >= 0; alpha,beta >= 0; alpha+beta < 1",
           init: "sigma^2_1 = sigma^2_0", errors: "N(0,1) in paper"}
    priority: very_high
    build_decision: IMPLEMENT_AND_VALIDATE
    paper_code_discrepancy:
      note: "Authors state the JAE paper implements RNN-GARCH; the shipped code implements
             LSTM-tGARCH with Student-t errors and SMC inference."
      resolution: 'expose implementation="paper" and implementation="official_code"'

  - paper_id: liu2023_realrech
    title: Deep Learning Enhanced Realized GARCH
    authors: [Chen Liu, Chao Wang, Minh-Ngoc Tran, Robert Kohn]
    year: 2023
    paper_url: https://arxiv.org/abs/2302.08002
    local_pdf: 2302.08002v2.pdf
    official_repo: https://github.com/VBayesLab/RealRECH
    code_status: OFFICIAL
    code_language: [MATLAB]
    code_local: RealRECH-main.zip
    code_completeness: INCOMPLETE   # only SMC_for_RECH present; no DeepRGARCH
    integration_type: realized_bayesian
    models: [DeepRGARCH, RealizedGARCH]
    design_note: |
      RealRECH is exported as an alias of DeepRGARCH (the paper uses both
      names). RealizedGARCH (Hansen, Huang & Shek 2012) ships alongside as
      the baseline the paper measures against; beta_1 = 0 makes DeepRGARCH
      reproduce it exactly.
    key_equations: "Eqs.6a-6e DeepRGARCH(p,q); Eqs.7a-7f DeepRGARCH(1,1);
                    Eq.8 log-likelihood; Eqs.9-11 SMC; Eqs.12-13 data prep"
    spec: {lstm_input: "x_t = (omega_{t-1}, y_{t-1}, sigma^2_{t-1}, rv_{t-1})",
           g: ReLU, measurement: "rv_t = xi + phi*sigma^2_t + tau1*eps + tau2*(eps^2-1) + u_t",
           errors: "eps ~ N(0,1), u ~ N(0, sigma_u)",
           priors: "N(0,0.1) on LSTM parameters",
           inference: "SMC: likelihood annealing in-sample, data annealing rolling"}
    data: {source: Oxford-Man Institute Realized Library, n_indices: 31,
           measure: "5-min realized variance, scaled by c = sum y^2 / sum rv",
           returns: "100 * demeaned log return",
           range: "2004-01-01 .. 2022-01-01", split: "first half / second half"}
    priority: very_high
    build_decision: IMPLEMENT
    blockers: [missing_official_code, oxford_man_library_discontinued]

  - paper_id: rodikov2022_sigma_lstm
    title: Volatility-inspired sigma-LSTM cell
    authors: [German Rodikov, Nino Antulov-Fantulin]
    year: 2022
    paper_url: https://arxiv.org/abs/2205.07022
    local_pdf: 2205.07022v1.pdf
    integration_type: structural_cell
    models: [SigmaLSTM]
    design_note: |
      The cell and the model are one class: SigmaLSTM owns both the gate
      equations (4-9) and the filter, since the paper's cell is not reused
      independently of it. Its three unstated points are resolved against
      the 2023 sigma-Cell paper; see the module docstring.
    key_equations: "Eqs.4-9 cell; Eq.10 return output; Eq.11 variance readout; Eq.12 likelihood"
    data: {series: [S&P 500, Apple, Bitcoin-USD], rv: "minute-based, daily aggregation",
           preprocessing: "min-max 0..1", val: 200, test: 200}
    reproducible_exhibits: [Table III]
    code_status: NO_PUBLIC_CODE_IDENTIFIED
    priority: high
    build_decision: IMPLEMENT
    open_questions:
      - "Eq.8 o_t = N(0, W_o[C_t^2]): variance or std? reparameterisation unspecified"
      - "Eq.11 mean operator <C_t> unglossed"
      - "Eq.12 written as a loss but is 2x the Gaussian log-likelihood kernel (to maximise)"
    resolution_route: "deep-read rodikov2023_sigma_cell before implementing"

