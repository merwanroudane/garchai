    title: AI algorithms for fitting GARCH parameters to empirical financial data
    authors: [Luke De Clerk, Sergey Savel'ev]
    year: 2022
    venue: "Physica A 603, 127869"
    doi: 10.1016/j.physa.2022.127869
    paper_url: https://www.sciencedirect.com/science/article/pii/S0378437122005611
    local_pdf: "AI algorithms for fitting GARCH parameters to empirical financial data.pdf"
    license: "CC BY-NC-ND 4.0 (open access)"
    integration_type: amortized_inference
    models: [AmortizedGARCHInference, GARCHParameters]
    design_note: |
      NeuralGARCHEstimator is exported as an alias of
      AmortizedGARCHInference. The closed forms of Eqs. 2-4 are free
      functions (garch_moment_map, normalised_autocovariance,
      fourth_standardised_moment, empirical_moments) so they can be used
      without the network at all.
    key_equations:
      - "Eq.2 normalised autocovariance of squared returns:
