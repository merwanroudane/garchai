external_packages:
  # Blueprint §53: do NOT rebuild these as core novelty. Adapt or benchmark.
  - {name: arch, url: "https://github.com/bashtage/arch", role: PRIMARY_BASELINE,
     installed: "8.0.0", use: "classical univariate GARCH estimation + ArchAdapter"}
  - {name: mvgarch, url: "https://github.com/jack-tobin/mvgarch", role: MULTIVARIATE_BASELINE,
     installed: false}
  - {name: hybridecon, url: "https://github.com/merwanroudane/hybridecon", role: SIBLING_PACKAGE,
     installed: false,
     note: "Author's own package. Its GARCHLSTM is FEATURE-based; garchai must not
            collide with it namewise — hence FeatureGARCHLSTM / StructuralGARCHLSTM /
            EmbeddedGARCHLSTM / GARCHInformedLSTM (blueprint §39)."}
  - {name: harlstmgarch, role: EXTERNAL_BENCHMARK, installed: false}
  - {name: volatility-gamm, url: "https://github.com/aryanbhambu/GaMM", role: EXTERNAL_BENCHMARK}
  - {name: rugarch, role: R_REFERENCE}
  - {name: rmgarch, role: R_REFERENCE, use: "benchmark for NeuralDCC / NeuralBEKK"}
